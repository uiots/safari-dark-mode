<!doctype html><html><head><meta charset="utf-8"><style>html,body{background:white;color:#111}.dark{background:#101216;color:#eee}</style></head><body><button id="theme">Switch theme</button><button id="route">SPA navigation</button><script>theme.onclick=()=>document.documentElement.classList.toggle('dark');route.onclick=()=>history.pushState({},'',location.pathname+'?route=next');setTimeout(()=>document.body.dataset.delayed='ready',250);const host=document.createElement('section');document.body.append(host);const shadow=host.attachShadow({mode:'open'});shadow.innerHTML='<p>Shadow DOM content</p>';if('adoptedStyleSheets'in document){const sheet=new CSSStyleSheet();sheet.replaceSync('body{--fixture:constructed}');document.adoptedStyleSheets=[sheet]}</script></body></html>
